; Overrides for the Vercel (FrankenPHP) production image.
; The stock php.ini-production sets memory_limit=128M, which a full
; migrate run over a remote database can exhaust. A memory-exhaustion
; fatal is not catchable in PHP, so it surfaces as an empty HTTP 500.
memory_limit = 512M

; Migrations and first-request warmup are slow on a cold container, so a
; hard per-request execution cap only produces spurious timeouts.
max_execution_time = 0
max_input_time = -1

; Keep errors in the container log rather than leaking them to clients.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
